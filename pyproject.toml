[project]
name = "oagbench"
version = "0.1.0"
description = "Benchmark of vector RAG, ontology-augmented generation and hybrid GraphRAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai>=1.40"]
services = ["neo4j>=5.20", "qdrant-client>=1.10"]
dashboard = ["altair>=5", "streamlit>=1.38"]
local-embeddings = ["sentence-transformers>=3"]

[project.scripts]
oagbench = "oagbench.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oagbench"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Reference Cypher queries read better unbroken.
"src/oagbench/generate/gold.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
