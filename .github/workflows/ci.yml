name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: none # CI never calls a real AI provider
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra anthropic --extra openai --extra services --extra dashboard
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run oagbench demo
